version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uk-wind-backend-dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    environment:
      - PROJECT_NAME=UK Wind Energy Forecast & Accuracy Analytics
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - API_V1_PREFIX=/api/v1
      - CORS_ORIGINS=["http://localhost:5173","http://127.0.0.1:5173","http://localhost:3000"]
      - ELEXON_BASE_URL=https://data.elexon.co.uk/bmrs/api/v1
      - DEFAULT_DECISION_CUTOFF_TIME=11:00
      - ENVIRONMENT=development
    networks:
      - uk-wind-network

  frontend:
    image: node:20-alpine
    container_name: uk-wind-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - uk-wind-network

networks:
  uk-wind-network:
    driver: bridge
