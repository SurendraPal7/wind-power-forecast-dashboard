services:
  - type: web
    name: uk-wind-analytics-api
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: PROJECT_NAME
        value: UK Wind Energy Forecast & Accuracy Analytics
      - key: ENVIRONMENT
        value: production
      - key: ELEXON_BASE_URL
        value: https://data.elexon.co.uk/bmrs/api/v1
      - key: DEFAULT_DECISION_CUTOFF_TIME
        value: "11:00"
      - key: CORS_ORIGINS
        value: '["https://*.vercel.app"]'
    healthCheckPath: /api/v1/health
