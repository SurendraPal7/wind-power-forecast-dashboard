name: uk-wind-energy-analytics

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uk-wind-analytics-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=UK Wind Energy Forecast & Accuracy Analytics
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - API_V1_PREFIX=/api/v1
      - CORS_ORIGINS=["http://localhost:5173","http://127.0.0.1:5173","http://localhost:3000","http://127.0.0.1:3000"]
      - ELEXON_BASE_URL=https://data.elexon.co.uk/bmrs/api/v1
      - DEFAULT_DECISION_CUTOFF_TIME=11:00
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - uk-wind-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uk-wind-analytics-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - uk-wind-network

networks:
  uk-wind-network:
    driver: bridge
